[project]
name = "cheongyak-extract"
version = "0.1.0"
description = "청약 모집공고문 PDF 필드 추출 + 필드별 eval 리포트"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28",
    "pymupdf>=1.28.2",
    "beautifulsoup4>=4.12",
    "openai>=3.37.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cheongyak_extract"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
